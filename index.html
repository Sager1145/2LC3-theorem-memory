    try {
      const preferences=JSON.parse(localStorage.getItem('tq.settings.v1')||'{}');
      document.documentElement.dataset.theme=preferences.appearance==='dark'||preferences.appearance!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      document.documentElement.lang=preferences.language==='en'?'en':'zh-CN';
    } catch (_) { document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
  </script>
  <link rel="stylesheet" href="./assets/style.css?v=20260930-touch-feedback">
